<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ASCII Ocean — 用字元當像素的水下場景</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:#01040a}
  body{
    display:flex;align-items:center;justify-content:center;
    font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
    cursor:crosshair;
  }

  /* 場景本體：一個 <pre>，每禎換掉 textContent。
     顏色不是逐格畫的 —— 用一層漸層 + background-clip:text 透過文字顯色，
     所以上色完全不花每格的成本。 */
  #out{
    margin:0;
    white-space:pre;
    font-weight:600;
    letter-spacing:0;
    user-select:none;
    background:linear-gradient(180deg,
      #cdfbff 0%, #7fe8fb 9%, #3fc9ee 24%,
      #1d94d6 46%, #0f5faa 68%, #07306b 86%, #04173c 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    filter:drop-shadow(0 0 8px rgba(70,200,255,.20));
  }

  #hud{
    position:fixed;left:14px;bottom:12px;
    font-size:11px;line-height:1.7;color:#4e86a8;
    letter-spacing:.04em;pointer-events:none;
  }
  #hud b{color:#8fd4ef;font-weight:600}
  #hud kbd{
    color:#aee4f7;background:#0b2436;border:1px solid #16415c;
    border-radius:3px;padding:0 4px;font:inherit;
  }
  #hud,#title{
    background:rgba(1,4,10,.82);
    padding:6px 10px;border-radius:5px;
    backdrop-filter:blur(2px);
  }
  #title{
    position:fixed;left:14px;top:12px;
    font-size:11px;line-height:1.7;color:#3f6f8c;letter-spacing:.06em;
    pointer-events:none;
  }
  #title b{display:block;color:#9adcf3;font-size:13px;letter-spacing:.14em}
</style>
</head>
<body>

<pre id="out" aria-label="ASCII 水下場景動畫"></pre>

<div id="title"><b>A S C I I &nbsp; O C E A N</b>純字元渲染 · 無 WebGL · 無相依套件</div>
<div id="hud">
  <span id="stat">—</span><br>
  滑鼠 ＝ 視角　<kbd>空白鍵</kbd> 暫停　<kbd>C</kbd> 換字元集　<kbd>D</kbd> 深度圖　<kbd>W</kbd> 線框密度
</div>

<script>
(() => {
"use strict";

const pre  = document.getElementById("out");
const stat = document.getElementById("stat");

/* ══════════════════════════════════════════════════════════════
   整個效果的核心只有兩件事：
     1. 把 3D 點投影到一個「字元格」上，用 z-buffer 解決遮擋
     2. 把每格的亮度對應到一串由疏到密的字元
   沒有 WebGL，沒有 canvas 繪圖，輸出就是一大塊純文字。
   ══════════════════════════════════════════════════════════════ */

const RAMPS = [
  " .,:;clodxkO0KXNWM@",
  " .:-=+*#%@",
  " .`^\",:;Il!i~+_-?]}1)|/tfjrxnuvczXYUJCLQ0OZmwqpdbkhao*#MW&8%B@$",
];
let rampIdx = 0, RAMP = RAMPS[0], RMAX = RAMP.length - 1;

/* ── 字元格 ──────────────────────────────────────────────── */
const FONT_PX = 13, MAX_COLS = 240, MAX_ROWS = 100;
let COLS = 0, ROWS = 0, charW = 8, charH = FONT_PX, aspect = 1;
let zbuf, lbuf, codes;

function resize(){
  pre.style.fontSize = FONT_PX + "px";
  pre.style.lineHeight = FONT_PX + "px";
  const cs = getComputedStyle(pre);
  const ctx = document.createElement("canvas").getContext("2d");
  ctx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
  charW = ctx.measureText("M".repeat(40)).width / 40;
  charH = FONT_PX;

  COLS = Math.max(40, Math.min(MAX_COLS, Math.floor(innerWidth  / charW) - 1));
  ROWS = Math.max(20, Math.min(MAX_ROWS, Math.floor(innerHeight / charH) - 1));

  // 字元是高的長方形，投影時要補償，否則圓會變扁
  aspect = (COLS * charW) / (ROWS * charH);

  zbuf  = new Float32Array(COLS * ROWS);
  lbuf  = new Float32Array(COLS * ROWS);
  codes = new Uint16Array(ROWS * (COLS + 1));
}
addEventListener("resize", resize);
resize();

/* ── 相機 ───────────────────────────────────────────────── */
const cam = { x:0, y:-1.5, z:0, yaw:0, pitch:0.06, focal:1.08 };
let mx = .5, my = .5, cx = .5, cy = .5;
addEventListener("pointermove", e => { mx = e.clientX/innerWidth; my = e.clientY/innerHeight; });

let sy = 0, cyw = 1, sp = 0, cp = 1;

/* 光：從水面斜射下來 */
const LX = 0.26, LY = 0.95, LZ = 0.17;

/* ── 投影 + z-buffer 寫入 ───────────────────────────────── */
function splat(wx, wy, wz, lum, fat){
  const dx = wx - cam.x, dy = wy - cam.y, dz = wz - cam.z;

  const rx =  dx * cyw + dz * sy;
  let   rz = -dx * sy  + dz * cyw;
  const ry =  dy * cp - rz * sp;
        rz =  dy * sp + rz * cp;

  if (rz > -0.8) return;

  const inv  = 1 / -rz;
  const ndcX = rx * inv * cam.focal / aspect;
  const ndcY = ry * inv * cam.focal;
  if (ndcX < -1.1 || ndcX > 1.1 || ndcY < -1.1 || ndcY > 1.1) return;

  const dist = -rz;
  const L = lum * Math.exp(-dist * 0.021);     // 水的消光

  const c0 = ((ndcX * 0.5 + 0.5) * COLS) | 0;
  const r0 = ((0.5 - ndcY * 0.5) * ROWS) | 0;
  const r  = (fat && dist < 34) ? 1 : 0;

  for (let j = r0 - r; j <= r0 + r; j++){
    if (j < 0 || j >= ROWS) continue;
    const base = j * COLS;
    for (let i = c0 - r; i <= c0 + r; i++){
      if (i < 0 || i >= COLS) continue;
      const k = base + i;
      if (dist < zbuf[k]){ zbuf[k] = dist; lbuf[k] = L; }
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   主角：蝠鱝
   翼面是一個參數曲面 (u = 翼展, v = 前後)，法線用有限差分算。
   ══════════════════════════════════════════════════════════════ */
const M = { W:12.5, C:7.8, T:1.6, A:3.3, fs:1.25 };

function mantaLocal(u, v, t, out){
  const au = Math.abs(u);
  const chord = M.C * (1 - 0.78*au*au) * (1 - 0.14*au);  // 翼端收窄
  const sweep = M.C * 0.52 * au * au;                    // 後掠
  const flap  = Math.sin(t * M.fs - au * 1.45) * M.A * Math.pow(au, 1.75);
  const thick = M.T * (1 - au*au*0.88) * (1 - v*v*0.85); // 中央厚、翼端薄

  out[0] = u * M.W;
  out[1] = flap + thick * 0.35;
  out[2] = v * chord - sweep;
  out[3] = thick;      // 給上下表面用
  return out;
}

const _a = [0,0,0,0], _b = [0,0,0,0], _c = [0,0,0,0];

function drawManta(t){
  // 身體在世界中的姿態：沿一條緩慢的弧線巡游
  // 擺在相機上方 —— 從腹面仰視才看得到翼面的輪廓，
  // 側面看過去整隻會壓扁成一條線。
  const gx = Math.sin(t * 0.17) * 6;
  const gy = 12 + Math.sin(t * 0.23 + 1.1) * 1.5;
  const gz = -23 + Math.cos(t * 0.17) * 4;
  // 轉向與側傾：跟著左右漂移同相，看起來像在盤旋
  const yaw  = Math.sin(t * 0.17) * 0.32;
  const sYaw = Math.sin(yaw), cYaw = Math.cos(yaw);
  const roll = Math.sin(t * 0.17 + 0.5) * 0.26;
  const sRol = Math.sin(roll), cRol = Math.cos(roll);

  const place = (p, side) => {
    // 上/下表面
    let x = p[0], y = p[1] + side * p[3] * 0.5, z = p[2];
    // roll（繞前後軸）
    const x2 = x * cRol - y * sRol, y2 = x * sRol + y * cRol;
    // yaw（繞 Y）
    return [ gx + x2 * cYaw + z * sYaw, gy + y2, gz - x2 * sYaw + z * cYaw ];
  };

  const US = 86, VS = 30, du = 0.016, dv = 0.016;

  for (let i = 0; i <= US; i++){
    const u = -1 + 2 * i / US;
    const au = Math.abs(u);
    for (let j = 0; j <= VS; j++){
      const v = -1 + 2 * j / VS;

      mantaLocal(u, v, t, _a);
      mantaLocal(u + du, v, t, _b);
      mantaLocal(u, v + dv, t, _c);

      // 有限差分求法線
      const ax = _b[0]-_a[0], ay = _b[1]-_a[1], az = _b[2]-_a[2];
      const bx = _c[0]-_a[0], by = _c[1]-_a[1], bz = _c[2]-_a[2];
      let nx = ay*bz - az*by, ny = az*bx - ax*bz, nz = ax*by - ay*bx;
      const inv = 1 / (Math.hypot(nx, ny, nz) || 1);
      nx *= inv; ny *= inv; nz *= inv;
      if (ny < 0){ nx = -nx; ny = -ny; nz = -nz; }

      const nd = Math.max(0, nx*LX + ny*LY + nz*LZ);

      for (const side of [1, -1]){
        const w = place(_a, side);
        // 背面有斑點、腹面乾淨偏亮
        let lum;
        if (side > 0){
          const spot = Math.sin(u*17) * Math.sin(v*11 + u*3);
          lum = 0.34 + nd * 0.52 + (spot > 0.55 ? 0.20 : 0);
        } else {
          // 腹面：亮底 + 五對鰓裂
          lum = 0.60 + nd * 0.26;
          if (au < 0.32 && v > -0.55 && v < 0.45){
            const slit = Math.abs(Math.sin(u * 29));
            if (slit > 0.86) lum -= 0.26;
          }
        }
        splat(w[0], w[1], w[2], lum, true);
      }
    }
  }

  // 頭部的兩片頭鰭
  for (const s of [-1, 1]){
    for (let k = 0; k <= 16; k++){
      const q = k / 16;
      const p = [ s * (1.5 + q * 0.9), 0.2 - q * 0.5, M.C * 0.98 + q * 2.6, 0 ];
      const w = place(p, 0);
      splat(w[0], w[1], w[2], 0.70, true);
    }
  }
  // 尾
  for (let k = 0; k <= 46; k++){
    const q = k / 46;
    const p = [ Math.sin(t*2.2 - q*2.4) * q * 0.9, -q * 0.5, -M.C * 0.55 - q * 17, 0 ];
    const w = place(p, 0);
    splat(w[0], w[1], w[2], 0.52 * (1 - q * 0.6), false);
  }
}

/* ══════════════════════════════════════════════════════════════
   配角：只保留會「動」而且不搶戲的東西
   ══════════════════════════════════════════════════════════════ */

/* 遠方的小魚群 */
const FISH = [];
for (let i = 0; i < 52; i++)
  FISH.push({ o:(Math.random()-.5)*9, oy:(Math.random()-.5)*5, oz:(Math.random()-.5)*11, ph:Math.random()*6.28 });

function drawFish(t){
  const gx = -16 + Math.sin(t*0.26) * 9;
  const gy = 5.5 + Math.sin(t*0.2+1.2) * 2.4;
  const gz = -52;
  const dir = Math.cos(t*0.26) > 0 ? 1 : -1;
  for (const f of FISH){
    const x = gx + f.o + Math.sin(t*1.6+f.ph)*0.45;
    const y = gy + f.oy + Math.sin(t*2.2+f.ph)*0.3;
    const z = gz + f.oz;
    const tail = Math.sin(t*9 + f.ph) * 0.4;
    splat(x,            y,            z, 0.80, false);
    splat(x - 0.5*dir,  y,            z, 0.72, false);
    splat(x - 1.0*dir,  y + tail*0.5, z, 0.55, false);
  }
}

/* 氣泡 */
const BUB = [];
for (let i = 0; i < 90; i++)
  BUB.push({ x:(Math.random()-.5)*44, y:-26+Math.random()*44, z:-8-Math.random()*48,
             v:1.5+Math.random()*3, w:Math.random()*6.28, a:.25+Math.random()*.8 });

function drawBubbles(t, dt){
  for (const b of BUB){
    b.y += b.v * dt;
    if (b.y > 13){ b.y = -26; b.x = (Math.random()-.5)*44; b.z = -8-Math.random()*48; }
    splat(b.x + Math.sin(t*2.4+b.w)*b.a, b.y, b.z, 0.92, b.a > 0.75);
  }
}

/* 懸浮微粒 */
const SNOW = [];
for (let i = 0; i < 230; i++)
  SNOW.push({ x:(Math.random()-.5)*62, y:-26+Math.random()*44, z:-5-Math.random()*56,
              s:.12+Math.random()*.3, w:Math.random()*6.28 });

function drawSnow(t, dt){
  for (const p of SNOW){
    p.y -= p.s * dt;
    if (p.y < -28){ p.y = 15; p.x = (Math.random()-.5)*62; }
    splat(p.x + Math.sin(t*.6+p.w)*.5, p.y, p.z, 0.26, false);
  }
}

/* 海床：只留一道遠方的輪廓，不搶戲。
   取樣間距隨距離放大（x 線性、z 平方），否則遠處的點會在螢幕上擠成一團。 */
function drawBed(t){
  const FY = -21;
  for (let z = -22; z > -66; z -= Math.max(2.0, z*z*0.0040)){
    const span = Math.min(34, -z * 0.62);
    const step = Math.max(1.4, -z * 0.055);
    for (let x = -span; x <= span; x += step){
      const h = Math.sin(x*0.17)*1.1 + Math.sin(z*0.2+1.3)*1.4 + Math.sin((x+z)*0.08)*2.0;
      splat(x, FY + h, z, 0.13 + (h + 4.5) * 0.022, false);
    }
  }
}

/* ══════════════════════════════════════════════════════════════
   背景（逐格，不走 3D）：深度漸層 + 光柱 + 水面波光
   ══════════════════════════════════════════════════════════════ */
function background(t){
  for (let j = 0; j < ROWS; j++){
    const v = j / ROWS;
    const depth = 0.052 * (1 - v) * (1 - v);   // 水本身幾乎是空的，留白給主體
    const surf  = Math.max(0, 1 - v * 7.5);          // 只在最上方幾列
    const rowB  = j * COLS;

    for (let i = 0; i < COLS; i++){
      const u = i / COLS;

      // 光柱
      let ray = Math.sin(u*8.5 + v*2.0 + Math.sin(u*3.1 + t*0.22)*1.1 + t*0.1);
      ray = Math.pow(Math.max(0, ray), 6) * (1 - v) * 0.15;

      // 水面波光：幾道橫向起伏的亮帶
      const wave = Math.sin(u*21 + t*1.9) * 0.5 + Math.sin(u*9 - t*1.3) * 0.5;
      const shimmer = surf * Math.pow(Math.max(0, wave), 3) * 0.55;

      const k = rowB + i;
      const amb = depth + ray + shimmer;
      if (zbuf[k] === Infinity) lbuf[k] = amb;
      else                      lbuf[k] += ray * 0.18;
    }
  }
}

/* ── 輸出 ───────────────────────────────────────────────── */
let depthOnly = false, dither = true;

function render(){
  let w = 0;
  for (let j = 0; j < ROWS; j++){
    const rowB = j * COLS;
    for (let i = 0; i < COLS; i++){
      const k = rowB + i;
      let L = depthOnly
        ? (zbuf[k] === Infinity ? 0 : Math.max(0, 1 - zbuf[k] / 60))
        : lbuf[k];
      // 抖動只能加在「本來就有東西」的地方，否則會把近乎全黑的背景
      // 變成一片棋盤格雜點。
      if (dither && L > 0.06) L += ((i ^ j) & 1) ? 0.016 : -0.016;
      if (L < 0) L = 0; else if (L > 1) L = 1;
      codes[w++] = RAMP.charCodeAt((L * RMAX + 0.5) | 0);
    }
    codes[w++] = 10;
  }
  let out = "";
  for (let p = 0; p < w; p += 4096)
    out += String.fromCharCode.apply(null, codes.subarray(p, Math.min(p + 4096, w)));
  pre.textContent = out;
}

/* ── 主迴圈 ─────────────────────────────────────────────── */
let paused = false, last = performance.now(), t = 0;
let frames = 0, fpsLast = last;

function frame(now){
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  if (!paused) t += dt;

  cx += (mx - cx) * 0.055;
  cy += (my - cy) * 0.055;
  cam.yaw   = (cx - .5) * 0.42;
  // 仰視約 46 度：太平會把翼面壓扁成一條線，太陡則看不到側影。
  cam.pitch = -0.70 - (cy - .5) * 0.30;
  cam.x     = (cx - .5) * 7;
  cam.y     = -7 - (cy - .5) * 5;
  sy = Math.sin(cam.yaw); cyw = Math.cos(cam.yaw);
  sp = Math.sin(cam.pitch); cp = Math.cos(cam.pitch);

  zbuf.fill(Infinity); lbuf.fill(0);

  drawBed(t);
  drawSnow(t, paused ? 0 : dt);
  drawFish(t);
  drawManta(t);
  drawBubbles(t, paused ? 0 : dt);

  background(t);
  render();

  frames++;
  if (now - fpsLast > 500){
    const fps = Math.round(frames * 1000 / (now - fpsLast));
    frames = 0; fpsLast = now;
    stat.innerHTML = `<b>${COLS}×${ROWS}</b> 格 · <b>${(COLS*ROWS).toLocaleString()}</b> 字元/禎 · <b>${fps}</b> fps`;
  }
}
requestAnimationFrame(frame);

addEventListener("keydown", e => {
  if (e.code === "Space"){ paused = !paused; e.preventDefault(); }
  if (e.key === "c" || e.key === "C"){ rampIdx = (rampIdx+1) % RAMPS.length; RAMP = RAMPS[rampIdx]; RMAX = RAMP.length-1; }
  if (e.key === "d" || e.key === "D") depthOnly = !depthOnly;
  if (e.key === "w" || e.key === "W") dither = !dither;
});

})();
</script>
</body>
</html>
